# AI Article — MVP deployment. Copy .env.example to .env and fill it in first.
# Networks: "internal" has no route to the internet (database, sandbox, GROBID);
# only api/worker join "egress" (Claude API, PubMed, Crossref) and only caddy is exposed.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: aiarticle
      POSTGRES_USER: aiarticle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiarticle"]
      interval: 10s
    restart: unless-stopped

  sandbox:
    build: {context: ., dockerfile: deploy/Dockerfile.sandbox}
    environment:
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:?set in .env}
    networks: [internal]
    read_only: true
    tmpfs: [/tmp:size=256m]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 1.0
    pids_limit: 256
    restart: unless-stopped

  grobid:
    image: lfoppiano/grobid:0.8.1
    networks: [internal]
    restart: unless-stopped

  api: &app
    build: {context: ., dockerfile: deploy/Dockerfile}
    env_file: .env
    environment: &appenv
      AI_ARTICLE_DATABASE_URL: postgresql+psycopg://aiarticle:${POSTGRES_PASSWORD}@db:5432/aiarticle
      AI_ARTICLE_SANDBOX: http
      AI_ARTICLE_SANDBOX_URL: http://sandbox:8080
      AI_ARTICLE_SANDBOX_TOKEN: ${SANDBOX_TOKEN}
      AI_ARTICLE_GROBID_URL: http://grobid:8070
      AI_ARTICLE_WORKER: external
      AI_ARTICLE_COOKIE_SECURE: "1"
    volumes: [appdata:/data]
    networks: [internal, egress]
    depends_on:
      db: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp:size=512m]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    working_dir: /srv/backend

  caddy:
    image: caddy:2
    environment:
      DOMAIN: ${DOMAIN:?set in .env}
    ports: ["443:443", "80:80"]
    volumes: [./deploy/Caddyfile:/etc/caddy/Caddyfile:ro, caddydata:/data]
    networks: [egress]
    depends_on: [api]
    restart: unless-stopped

networks:
  internal: {internal: true}
  egress: {}

volumes: {pgdata: {}, appdata: {}, caddydata: {}}
